name: Dagens menyer

# Hämtar lunchmenyerna och publicerar sidan på GitHub Pages.
# Tiderna är UTC: 05.40, 06.10, 07.45 och 08.45 (06.40–09.45 svensk vintertid).
# GitHub kan starta schemalagda körningar några minuter sent.
on:
  schedule:
    - cron: "40 5 * * 1-5"
    - cron: "10 6 * * 1-5"
    - cron: "45 7 * * 1-5"
    - cron: "45 8 * * 1-5"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: menyer
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installera
        run: |
          pip install requests beautifulsoup4 lxml playwright
          python -m playwright install --with-deps chromium

      - name: Hämta menyer
        run: python scripts/update_menus.py

      - name: Spara menus.json
        run: |
          git config user.name "Lunchradarn"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add menus.json
          if ! git diff --cached --quiet; then
            git commit -m "Menyer $(TZ=Europe/Stockholm date '+%F %H:%M')"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Förbered sidan
        run: |
          mkdir -p _site
          cp index.html menus.json scn-logo-white.png .nojekyll _site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
