name: Dagens menyer

# Hämtar lunchmenyerna och publicerar sidan på GitHub Pages.
# Körs vardagar 06.40, 07.10, 08.45, 10.00 och 11.00 svensk tid – samma tider året runt.
# GitHub räknar schemat i UTC, så varje tid finns två gånger (sommar- och vintertid);
# jobbet "tid" släpper bara igenom den körning som motsvarar en av tiderna i Stockholm just då.
# GitHub kan starta schemalagda körningar några minuter sent – det påverkar inte kontrollen.
on:
  schedule:
    - cron: "40 4 * * 1-5"   # 06.40 sommartid
    - cron: "40 5 * * 1-5"   # 06.40 vintertid
    - cron: "10 5 * * 1-5"   # 07.10 sommartid
    - cron: "10 6 * * 1-5"   # 07.10 vintertid
    - cron: "45 6 * * 1-5"   # 08.45 sommartid
    - cron: "45 7 * * 1-5"   # 08.45 vintertid
    - cron: "0 8 * * 1-5"    # 10.00 sommartid
    - cron: "0 9 * * 1-5"    # 10.00 vintertid / 11.00 sommartid
    - cron: "0 10 * * 1-5"   # 11.00 vintertid
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: menyer
  cancel-in-progress: false

jobs:
  tid:
    runs-on: ubuntu-latest
    outputs:
      kor: ${{ steps.kontroll.outputs.kor }}
    steps:
      - id: kontroll
        env:
          SCHEMA: ${{ github.event.schedule }}
        run: |
          if [ -z "$SCHEMA" ]; then echo "kor=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          set -- $SCHEMA
          lokal=$(TZ=Europe/Stockholm date -d "$(date -u +%F) $2:$1 UTC" +%H:%M)
          case "$lokal" in
            06:40|07:10|08:45|10:00|11:00) echo "kor=true" >> "$GITHUB_OUTPUT"; echo "Kör: $lokal svensk tid" ;;
            *) echo "kor=false" >> "$GITHUB_OUTPUT"; echo "Hoppar över: $lokal svensk tid" ;;
          esac

  update:
    needs: tid
    if: needs.tid.outputs.kor == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installera
        run: |
          pip install requests beautifulsoup4 lxml playwright
          python -m playwright install --with-deps chromium

      - name: Hämta menyer
        run: python scripts/update_menus.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Spara menus.json
        run: |
          git config user.name "Lunchradarn"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add menus.json translations.json
          if ! git diff --cached --quiet; then
            git commit -m "Menyer $(TZ=Europe/Stockholm date '+%F %H:%M')"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Förbered sidan
        run: |
          mkdir -p _site
          cp index.html menus.json scn-logo-white.png .nojekyll _site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
