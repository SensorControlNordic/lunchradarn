<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>SCN Lunchradarn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: mörkt SCN-band med radar överst, sedan kontroller och ett rutnät av restaurangkort sorterade på gångtid. */
:root{
  --red:#E52B1F; --red-deep:#C4211A; --ink:#2B2E31; --bg:#F3F3F1; --surface:#FFFFFF;
  --text:#1E2023; --muted:#5D6168; --line:#E1E3E5;
  --kott:#C4211A; --fisk:#1D6FA8; --veg:#2F8A4E; --soppa:#B7791F; --ovrigt:#5D6168;
  --band:#2B2E31; --band-text:#F7F7F7; --band-muted:#B9BDC2;
  --font-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --font-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16181A; --surface:#212427; --text:#ECEDEE; --muted:#A3A8AE; --line:#33373B;
    --kott:#F0564C; --fisk:#5AA9E0; --veg:#5CC183; --soppa:#E2A84B; --ovrigt:#A3A8AE;
    --band:#0F1112; --band-text:#F7F7F7; --band-muted:#9EA3A8;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#16181A; --surface:#212427; --text:#ECEDEE; --muted:#A3A8AE; --line:#33373B;
  --kott:#F0564C; --fisk:#5AA9E0; --veg:#5CC183; --soppa:#E2A84B; --ovrigt:#A3A8AE;
  --band:#0F1112; --band-text:#F7F7F7; --band-muted:#9EA3A8;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:16px;line-height:1.45}
a{color:inherit}
button{font:inherit}
:focus-visible{outline:3px solid var(--red);outline-offset:2px;border-radius:6px}

/* Band */
.band{background:var(--band);color:var(--band-text);border-bottom:4px solid var(--red)}
.band-inner{max-width:1180px;margin:0 auto;padding:22px 20px 20px;display:grid;grid-template-columns:1fr auto;gap:24px;align-items:center}
.brand{display:flex;flex-direction:column;gap:10px;min-width:0}
.brand img{height:34px;width:auto;align-self:flex-start}
h1{font-family:var(--font-display);font-weight:700;font-size:clamp(2.4rem,6vw,3.6rem);line-height:.95;margin:4px 0 0;letter-spacing:.01em;text-wrap:balance}
h1 span{color:var(--red)}
.dateline{font-family:var(--font-display);font-size:1.25rem;font-weight:500;color:var(--band-muted);letter-spacing:.03em}
.tagline{color:var(--band-muted);max-width:52ch;margin:0}
.hunger{margin-top:6px;max-width:440px}
.hunger-row{display:flex;justify-content:space-between;gap:12px;font-family:var(--font-display);font-size:1.05rem;letter-spacing:.04em;text-transform:uppercase}
.hunger-row b{color:var(--band-text);font-weight:600}
.meter{height:10px;border-radius:5px;background:#3B3F43;overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,#7A7F85,var(--red));border-radius:5px;transition:width .8s ease}
.hunger-msg{font-size:.95rem;color:var(--band-muted);margin-top:6px}
.radar-wrap{display:flex;flex-direction:column;align-items:center;gap:6px}
#radar{width:250px;height:250px;display:block}
.radar-cap{font-size:.8rem;color:var(--band-muted);font-family:var(--font-display);letter-spacing:.05em;text-transform:uppercase}

/* Kontroller */
main{max-width:1180px;margin:0 auto;padding:22px 20px 40px;display:flex;flex-direction:column;gap:22px}
.controls{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--surface);color:var(--text);border-radius:999px;padding:7px 14px;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:7px}
.chip .dot{width:9px;height:9px;border-radius:50%;background:var(--muted)}
.chip[aria-pressed="true"]{border-color:var(--text);background:var(--text);color:var(--surface)}
.chip[aria-pressed="true"] .dot{box-shadow:0 0 0 2px var(--surface)}
.spin{border:0;background:var(--red);color:#fff;font-family:var(--font-display);font-weight:600;font-size:1.15rem;letter-spacing:.04em;text-transform:uppercase;padding:11px 20px;border-radius:10px;cursor:pointer;box-shadow:0 2px 0 var(--red-deep)}
.spin:hover{background:var(--red-deep)}
.pick{display:none;background:var(--surface);border:1.5px solid var(--line);border-left:6px solid var(--red);border-radius:12px;padding:14px 18px;gap:4px;flex-direction:column}
.pick.show{display:flex}
.pick .lbl{font-family:var(--font-display);text-transform:uppercase;letter-spacing:.06em;font-size:.9rem;color:var(--muted)}
.pick .dish{font-size:1.15rem;font-weight:600}
.pick .where{color:var(--muted)}
.notice{background:var(--surface);border:1.5px dashed var(--line);border-radius:12px;padding:12px 16px;color:var(--muted)}

/* Kort */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px 14px;display:flex;flex-direction:column;gap:12px;transition:box-shadow .3s,border-color .3s}
.card.hit{border-color:var(--red);box-shadow:0 0 0 3px color-mix(in srgb,var(--red) 30%,transparent)}
.card-head{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:start}
.card h2{font-family:var(--font-display);font-weight:700;font-size:1.65rem;line-height:1;margin:0;text-wrap:balance}
.walk{font-family:var(--font-display);font-weight:600;font-size:1.05rem;background:var(--ink);color:#fff;border-radius:8px;padding:4px 9px;white-space:nowrap;display:inline-flex;gap:6px;align-items:center}
:root[data-theme="dark"] .walk{background:#3A3E42}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .walk{background:#3A3E42}}
.walk svg{width:13px;height:15px;fill:currentColor}
.meta{grid-column:1 / -1;display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--muted);font-size:.93rem}
.meta b{color:var(--text);font-weight:600;font-variant-numeric:tabular-nums}
.pill{display:inline-block;font-size:.78rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;border-radius:999px;padding:2px 9px;border:1px solid var(--line);color:var(--muted)}
.pill.open{color:var(--veg);border-color:color-mix(in srgb,var(--veg) 45%,transparent)}
.pill.fixed{color:var(--soppa);border-color:color-mix(in srgb,var(--soppa) 45%,transparent)}
.pill.fun{color:var(--red);border-color:color-mix(in srgb,var(--red) 45%,transparent)}
ul.dishes{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.dishes li{display:grid;grid-template-columns:62px 1fr;gap:10px;align-items:baseline;padding-left:10px;border-left:3px solid var(--c,var(--muted))}
.dishes li.dim{opacity:.28}
.dishes .t{font-family:var(--font-display);font-weight:600;text-transform:uppercase;font-size:.85rem;letter-spacing:.05em;color:var(--c,var(--muted))}
.extra{font-size:.93rem;color:var(--muted);margin:0}
.empty{color:var(--muted);margin:0}
.src{margin-top:auto;font-size:.8rem;color:var(--muted);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:9px}
.src a{color:var(--muted)}

footer{max-width:1180px;margin:0 auto;padding:0 20px 36px;color:var(--muted);font-size:.9rem;display:flex;flex-direction:column;gap:4px}

@media (max-width:720px){
  .band-inner{grid-template-columns:1fr}
  .radar-wrap{align-items:center}
  #radar{width:240px;height:240px}
  .grid{grid-template-columns:1fr}
}
@media (prefers-reduced-motion: reduce){
  *{transition:none!important;animation:none!important}
}
</style>
</head>
<body>
<header class="band">
  <div class="band-inner">
    <div class="brand">
      <img src="scn-logo-white.png" alt="SCN">
      <h1>Lunch<span>radarn</span></h1>

        <div class="hunger-msg" id="hungerMsg">&nbsp;</div>

      <canvas id="radar" width="460" height="460" role="img" aria-label="Radar som visar lunchställena runt kontoret, norr uppåt"></canvas>

<main>

  <div class="pick" id="pick" aria-live="polite">
    <span class="lbl" id="pickLbl">Radarn föreslår</span>
    <span class="dish" id="pickDish"></span>
    <span class="where" id="pickWhere"></span>
  </div>
  <div class="notice" id="notice" hidden></div>
  <div class="grid" id="grid"></div>
</main>

<footer>
  <span id="updated">&nbsp;</span>
  <span>Gångtiderna är ungefärliga. Priser och rätter kan ändras, kolla gärna på plats.</span>
</footer>

  let pct,msg;
  if(!isToday){pct=12;msg="Helgläge. Sensorn är avstängd till måndag."}
  else if(mins<start){pct=5;msg="Frukostläge. Sensorn har knappt vaknat."}
  else if(mins<peak){pct=Math.round(10+85*(mins-start)/(peak-start));const left=peak-mins;msg="Larmnivå nås om "+(left>=60?Math.floor(left/60)+" h ":"")+(left%60)+" min (11.30).";}
  else if(mins<=end){pct=100;msg="Larm! Ta med en kollega och gå.";}
  else {pct=8;msg="Mätt. Sensorn kalibreras om till i morgon.";}
  document.getElementById("hungerVal").textContent=pct+" %";
  requestAnimationFrame(()=>{document.getElementById("hungerBar").style.width=pct+"%"});
  document.getElementById("hungerMsg").textContent=msg;
})();

let DATA=null, filter="alla";
function todays(p){
  if(p.fixed) return {dishes:p.fixed,extra:null,fixed:true};
  const r=DATA&&DATA.restaurants&&DATA.restaurants[p.id];
  const day=r&&r.days&&r.days[showIso];
  if(!day||!day.dishes||!day.dishes.length) return {dishes:[],extra:null,fixed:false};
  return {dishes:day.dishes,extra:day.extra||null,fixed:false};
}
function openState(p){
  if(!isToday||now.dow===0||now.dow===6) return null;
  const mins=now.h*60+now.min, a=p.open[0]*60+p.open[1], b=p.open[2]*60+p.open[3];
  if(mins>=a&&mins<b) return {cls:"open",txt:"Lunch nu"};
  if(mins<a) return {cls:"",txt:"Lunch från "+hhmm(p.open[0],p.open[1])};
  return {cls:"",txt:"Lunchen slut"};
}
const WALK_ICON='<svg viewBox="0 0 13 15" aria-hidden="true"><circle cx="7.5" cy="1.8" r="1.8"/><path d="M5.2 4.6l2.6.3 1.4 2.4 2.3.9-.4 1-2.8-1-.7-1.1-.6 2.6 2 2.1.8 3.2-1.1.3-.8-2.9-2.3-2-1 3.3-2.8 1.6-.6-1 2.4-1.4 1.6-5.3-1 .6-.6 2-1.1-.3.8-2.6z"/></svg>';

function render(){
  const grid=document.getElementById("grid");
  grid.innerHTML="";
  PLACES.forEach(p=>{
    const t=todays(p), st=openState(p);
    const c=document.createElement("article");
    c.className="card"; c.id="card-"+p.id;
    const allText=t.dishes.map(x=>x.n).join(" ")+" "+(t.extra||"");
    const fun=/pannkak/i.test(allText)?'<span class="pill fun">Pannkakor</span>':(/ärtsoppa/i.test(allText)?'<span class="pill fun">Ärtsoppa</span>':"");
    let body;
    if(t.dishes.length){
      body='<ul class="dishes">'+t.dishes.map(x=>{
        const tt=TYPES[x.t]?x.t:"ovrigt";
        const dim=(filter!=="alla"&&tt!==filter)?' class="dim"':"";
        return '<li'+dim+' style="--c:var(--'+tt+')"><span class="t">'+TYPES[tt]+'</span><span>'+esc(x.n)+'</span></li>';
      }).join("")+"</ul>";
      if(t.extra) body+='<p class="extra">'+esc(t.extra)+'</p>';
    } else {
      body='<p class="empty">'+(isToday&&now.h<8?"Dagens meny hämtas strax före åtta.":"Ingen meny publicerad för den här dagen än.")+'</p>';
    }
    c.innerHTML=
      '<div class="card-head"><h2>'+esc(p.name)+'</h2><span class="walk" title="Ungefärlig gångtid från kontoret">'+WALK_ICON+p.walk+' min</span>'+
      '<div class="meta"><span><b>'+esc(p.price)+'</b> · '+esc(p.priceNote)+'</span><span>'+esc(p.addr)+'</span>'+
      (st?'<span class="pill '+st.cls+'">'+st.txt+'</span>':'')+(t.fixed?'<span class="pill fixed">Fast lunchmeny</span>':'')+fun+'</div></div>'+
      body+
      '<div class="src"><span>'+(p.src?'Källa: <a href="'+p.src+'" target="_blank" rel="noopener">'+esc(p.srcName)+'</a>':esc(p.srcName))+'</span><span>Lunch '+hhmm(p.open[0],p.open[1])+'–'+hhmm(p.open[2],p.open[3])+'</span></div>';
    grid.appendChild(c);
  });
  const missing=PLACES.filter(p=>!p.fixed&&!todays(p).dishes.length).length;
  const n=document.getElementById("notice");
  const msgs=[];
  if(weekendNote) msgs.push(weekendNote);
  if(DATA&&DATA._fromFallback) msgs.push("Kunde inte läsa senaste menyfilen, så sidan visar en sparad version.");
  if(missing&&isToday&&now.h>=8&&!weekendNote) msgs.push(missing+" ställe"+(missing>1?"n":"")+" har inte lagt ut dagens meny än.");
  n.hidden=!msgs.length; n.textContent=msgs.join(" ");
  if(DATA&&DATA.updated){
    const u=new Date(DATA.updated);
    const f=new Intl.DateTimeFormat("sv-SE",{timeZone:"Europe/Stockholm",weekday:"long",day:"numeric",month:"long",hour:"2-digit",minute:"2-digit"}).format(u);
    document.getElementById("updated").textContent="Menyerna hämtades senast "+f+".";
  }
}

document.querySelectorAll(".chip").forEach(b=>b.addEventListener("click",()=>{
  filter=b.dataset.f;
  document.querySelectorAll(".chip").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));
  render();
}));

// Slumpa
document.getElementById("spin").addEventListener("click",()=>{
  const pool=[];
  PLACES.forEach(p=>todays(p).dishes.forEach(x=>{if(filter==="alla"||x.t===filter) pool.push({p,x})}));
  const pick=document.getElementById("pick");
  pick.classList.add("show");
  if(!pool.length){document.getElementById("pickLbl").textContent="Radarn hittar inget";document.getElementById("pickDish").textContent="Inga rätter matchar filtret i dag.";document.getElementById("pickWhere").textContent="";return}
  const reduce=window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const final=pool[Math.floor(Math.random()*pool.length)];
  document.querySelectorAll(".card.hit").forEach(c=>c.classList.remove("hit"));
  document.getElementById("pickLbl").textContent="Skannar…";
  let i=0, steps=reduce?0:14;
  const tick=()=>{
    const it=i<steps?pool[Math.floor(Math.random()*pool.length)]:final;
    document.getElementById("pickDish").textContent=it.x.n;
    document.getElementById("pickWhere").textContent=it.p.name+" · "+it.p.walk+" min bort · "+it.p.price;
    if(i<steps){i++;setTimeout(tick,50+i*12)}
    else{
      document.getElementById("pickLbl").textContent="Radarn föreslår";
      const card=document.getElementById("card-"+final.p.id);
      if(card) card.classList.add("hit");
      highlight=final.p.id;
    }
  };
  tick();
});

// Radar
let highlight=null;
const cv=document.getElementById("radar"), ctx=cv.getContext("2d");
const S=cv.width, C=S/2, R=S/2-14, MAXM=700;
function pos(p){
  const x=(p.lon-OFFICE.lon)*56700, y=(p.lat-OFFICE.lat)*111200;
  const dist=Math.hypot(x,y), k=Math.sqrt(Math.min(dist,MAXM)/MAXM)*R/(dist||1);
  return {x:C+x*k, y:C-y*k, a:Math.atan2(x,y)};
}
const pts=PLACES.map(p=>Object.assign({p},pos(p)));
function drawRadar(sweep){
  ctx.clearRect(0,0,S,S);
  ctx.fillStyle="#1d2022";ctx.beginPath();ctx.arc(C,C,R,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle="rgba(255,255,255,.14)";ctx.lineWidth=2;
  ctx.font="600 17px Barlow Condensed, Arial Narrow, sans-serif";ctx.textAlign="left";ctx.textBaseline="bottom";
  [[100,"100 m"],[300,"300 m"],[600,"600 m"]].forEach(([m,l])=>{const r=Math.sqrt(m/MAXM)*R;ctx.strokeStyle="rgba(255,255,255,.14)";ctx.beginPath();ctx.arc(C,C,r,0,Math.PI*2);ctx.stroke();ctx.fillStyle="rgba(255,255,255,.32)";ctx.fillText(l,C+r*0.72+4,C+r*0.72-2)});
  ctx.beginPath();ctx.moveTo(C,C-R);ctx.lineTo(C,C+R);ctx.moveTo(C-R,C);ctx.lineTo(C+R,C);ctx.stroke();
  if(sweep!==null){
    const g=ctx.createConicGradient?ctx.createConicGradient(sweep-Math.PI/2-0.9,C,C):null;
    if(g){g.addColorStop(0,"rgba(229,43,31,0)");g.addColorStop(0.143,"rgba(229,43,31,.38)");g.addColorStop(0.1431,"rgba(229,43,31,0)");
      ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(C,C);ctx.arc(C,C,R,sweep-Math.PI/2-0.9,sweep-Math.PI/2);ctx.closePath();ctx.fill();}
    ctx.strokeStyle="rgba(229,43,31,.9)";ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(C,C);ctx.lineTo(C+R*Math.sin(sweep),C-R*Math.cos(sweep));ctx.stroke();
  }
  ctx.font="600 23px Barlow Condensed, Arial Narrow, sans-serif";ctx.textBaseline="middle";
  pts.forEach(o=>{
    let glow=0.55;
    if(sweep!==null){let d=((sweep-(o.a<0?o.a+Math.PI*2:o.a))%(Math.PI*2)+Math.PI*2)%(Math.PI*2);glow=Math.max(0.45,1-d/2.2)}
    const hot=highlight===o.p.id;
    ctx.fillStyle=hot?"#ffffff":"rgba(229,43,31,"+glow+")";
    ctx.beginPath();ctx.arc(o.x,o.y,hot?10:7,0,Math.PI*2);ctx.fill();
    ctx.fillStyle="rgba(247,247,247,"+(hot?1:Math.min(1,glow+0.2))+")";
    const left=o.x<C-2&&(o.x-ctx.measureText(o.p.short).width-16)>0;
    ctx.textAlign=left?"right":"left";
    ctx.fillText(o.p.short,o.x+(left?-12:12),o.y);
  });
  ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(C,C,8,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#E52B1F";ctx.beginPath();ctx.arc(C,C,4,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="rgba(247,247,247,.55)";ctx.textAlign="center";ctx.font="600 18px Barlow Condensed, Arial Narrow, sans-serif";ctx.fillText("N",C,22);
}
const reduceMotion=window.matchMedia("(prefers-reduced-motion: reduce)").matches;
if(reduceMotion){drawRadar(null)}
else{const t0=performance.now();(function loop(t){drawRadar(((t-t0)/2600)%1*Math.PI*2);requestAnimationFrame(loop)})(t0)}

// Data
function useData(d,fb){DATA=d;if(fb)DATA._fromFallback=true;render()}
let fallback=null;
try{fallback=JSON.parse(document.getElementById("fallback").textContent)}catch(e){}
useData(fallback||{restaurants:{}},false);
fetch("menus.json?v="+Date.now(),{cache:"no-store"})
  .then(r=>{if(!r.ok)throw new Error(r.status);return r.json()})
  .then(d=>useData(d,false))
  .catch(()=>{if(fallback){useData(fallback,true)}});
})();
</script>
